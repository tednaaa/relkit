[package]
name = "relkit"
version = "0.4.0"
edition = "2024"
description = "Interactive release tool that bumps the version, writes a linked changelog, then commits, tags and pushes."
license = "GPL-3.0-only"
repository = "https://github.com/tednaaa/relkit"
keywords = ["release", "changelog", "versioning", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
cliclack = "0.5.6"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
